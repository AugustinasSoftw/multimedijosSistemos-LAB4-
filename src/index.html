<!DOCTYPE html>
<html>
<head>
    <title>Lab 4 - WebRTC Face Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/data/face-min.js"></script>
    
    <style>
        body { text-align: center; background-color: #2c3e50; color: white; font-family: Arial; }
        .video-container { position: relative; display: inline-block; width: 640px; height: 480px; margin-top: 20px;}
        /* Absolute positioning forces the canvas to sit perfectly on top of the webcam video */
        video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; border: 2px solid white; border-radius: 8px;}
        video { background: #000; }
    </style>
</head>
<body>
    <h2>Lab 4: Real-Time Face Detection</h2>
    
    <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="face-canvas" width="640" height="480"></canvas>
    </div>

    <!-- <script src="/src/js/app.js"></script> -->
    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('face-canvas');
        const context = canvas.getContext('2d');
        
        // 1. WEBRTC: Request access to the webcam
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(function(stream) {
                // If the user says "Yes", pipe the camera stream into the HTML video tag
                video.srcObject = stream;
            })
            .catch(function(err) {
                console.error("Camera access denied or error: ", err);
            });
        
        // 2. TRACKING.JS: Set up the face tracking AI
        const tracker = new tracking.ObjectTracker('face');
        tracker.setInitialScale(4);
        tracker.setStepSize(2);
        tracker.setEdgesDensity(0.1);
        
        // Tell the tracker to watch our <video> element
        tracking.track('#webcam', tracker);
        
        // 3. DRAWING: Every time the AI finds a face, trigger this function
        tracker.on('track', function(event) {
            // Wipe the canvas clean every frame so boxes don't smear across the screen
            context.clearRect(0, 0, canvas.width, canvas.height);
        
            // If it finds faces, loop through them and draw a box
            event.data.forEach(function(rect) {
                context.strokeStyle = '#00ff00'; // Neon green box
                context.lineWidth = 4;
                context.strokeRect(rect.x, rect.y, rect.width, rect.height);
                
                context.font = '18px Arial';
                context.fillStyle = '#00ff00';
                context.fillText('Face Detected', rect.x, rect.y - 10);
            });
        });
    </script>
</body>
</html>
